<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pirámide y Sigilo</title>
<style>
  body { 
    font-family: sans-serif; 
    text-align: center; 
    padding: 15px; 
    background: #000;
    color: #fff;
    margin: 0;
    touch-action: manipulation;
    user-select: none;
  }
  h2 { margin: 20px 0 10px; font-size: 1.4rem; }
  
  .controles {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  input { 
    padding: 12px; 
    font-size: 16px; 
    width: 100%;
    max-width: 300px; 
    border: 2px solid #444; 
    border-radius: 8px; 
    box-sizing: border-box;
    touch-action: manipulation;
    background: #222;
    color: #fff;
  }
  button { 
    padding: 12px 15px; 
    font-size: 16px; 
    cursor: pointer; 
    color: white; 
    border: none; 
    border-radius: 8px; 
    flex-grow: 1;
    max-width: 200px;
    touch-action: manipulation;
  }
  .btn-crear { background: #4CAF50; }
  .btn-crear:active { background: #3d8b40; }
  .btn-limpiar { background: #ff9800; }
  .btn-limpiar:active { background: #e68900; }
  
  #pyramid { margin-top: 20px; overflow-x: auto; padding-bottom: 10px;}
  .row { display: flex; justify-content: center; margin-bottom: 8px; }
  .char {
    width: 40px; height: 40px; line-height: 40px;
    text-align: center; cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 22px; font-weight: bold;
    border-radius: 6px; transition: background 0.2s;
    touch-action: manipulation;
    color: #fff;
  }
  .char:active { background: #333; }

  /* Tachado normal (sin arcoíris) */
  .tached {
    text-decoration: line-through;
    color: #666;
  }

  /* Animación arcoíris tipo neón */
  @keyframes arcoiris {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .arcoiris {
    background: linear-gradient(90deg, #ff0000, #ff9900, #ffff00, #33cc33, #3399ff, #9933ff, #ff0000);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: arcoiris 2s linear infinite;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
    text-decoration: line-through;
  }

  #sigilo { margin-top: 20px; display: flex; flex-direction: column; align-items: center;}
  svg { 
    width: 100%; 
    max-width: 350px; 
    height: auto; 
  }
  .hit-area {
    stroke: transparent; 
    stroke-width: 25; 
    cursor: pointer;
  }
  .sigilo-linea {
    stroke: #fff; 
    stroke-width: 3; 
    pointer-events: none;
    transition: stroke 0.2s;
  }
  .sigilo-linea.activa { stroke: #e53935; stroke-width: 4; }
  .sigilo-punto { fill: #fff; pointer-events: none; }
  .sigilo-numero {
    font-family: sans-serif; font-size: 14px;
    font-weight: bold; fill: #fff;
    pointer-events: none;
  }

  /* ===== Varita flotante: solo se mueve mientras la mantienes pulsada ===== */
  #varita {
    position: fixed;
    width: min(160px, 40vw);
    right: 10px;
    bottom: 14vh;
    z-index: 50;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 10px rgba(180,120,255,.45));
    transition: filter .15s ease;
  }
  #varita.arrastrando {
    cursor: grabbing;
    transform: scale(1.1);
    filter: drop-shadow(0 0 16px rgba(255,215,0,.85));
  }
  #pista-varita {
    position: fixed;
    left: 10px;
    bottom: 10px;
    z-index: 49;
    color: #d8c2ff;
    font-size: 12px;
    background: rgba(20,10,35,.8);
    padding: 8px 12px;
    border-radius: 16px;
    pointer-events: none;
  }
</style>
</head>
<body>

  <h2>🔺 Pirámide</h2>
  <div class="controles">
    <input type="text" id="inputText" placeholder="Escribe tus siglas y números...">
    <button class="btn-crear" onclick="generar()">Crear Pirámide</button>
    <button class="btn-limpiar" onclick="limpiarPiramide()">Borrar Tachones</button>
  </div>
  <div id="pyramid"></div>

      <text class="sigilo-numero" x="60"  y="48"  text-anchor="middle">9</text>
    </svg>
  </div>

  <p id="pista-varita">✨ Mantén pulsada la varita y muévela libremente por la pantalla</p>

  <script>
    function generar() {
      const texto = document.getElementById('inputText').value.replace(/\s+/g, '');
      const pyramidDiv = document.getElementById('pyramid');
      pyramidDiv.innerHTML = '';
      if (!texto) return;

      let filas = [], i = 1, suma = 0;
      while (suma + i <= texto.length) { filas.push(i); suma += i; i++; }
      if (suma < texto.length) filas[filas.length - 1] += (texto.length - suma);

      let idx = 0;
      filas.forEach(cant => {
        let rowDiv = document.createElement('div');
        rowDiv.className = 'row';
        for (let j = 0; j < cant; j++) {
          let span = document.createElement('span');
          span.className = 'char';
          span.textContent = texto[idx];
          span.onclick = () => {
            span.classList.toggle('arcoiris');
          };
          rowDiv.appendChild(span);
          idx++;
        }
        pyramidDiv.appendChild(rowDiv);
      });
    }

    function limpiarPiramide() {
      document.querySelectorAll('.char').forEach(c => {
        c.classList.remove('arcoiris');
      });
    }

    function toggleLinea(grupo) {
      const lineaVisible = grupo.querySelector('.sigilo-linea');
      lineaVisible.classList.toggle('activa');
    }

    function limpiarSigilo() {
      document.querySelectorAll('.sigilo-linea').forEach(l => l.classList.remove('activa'));
    }

    img.alt = 'Varita mágica';
    img.id = 'varita';
    img.draggable = false;
    document.body.appendChild(img);

    let arrastrando = false, offsetX = 0, offsetY = 0;

    img.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      arrastrando = true;
      img.classList.add('arrastrando');
      const r = img.getBoundingClientRect();
      img.style.left = r.left + 'px';
      img.style.top = r.top + 'px';
      img.style.right = 'auto';
      img.style.bottom = 'auto';
      offsetX = e.clientX - r.left;
      offsetY = e.clientY - r.top;
    });

    window.addEventListener('pointermove', e => {
      if (!arrastrando) return;
      const maxX = window.innerWidth - img.offsetWidth;
      const maxY = window.innerHeight - img.offsetHeight;
      const x = Math.max(0, Math.min(e.clientX - offsetX, maxX));
      const y = Math.max(0, Math.min(e.clientY - offsetY, maxY));
      img.style.left = x + 'px';
      img.style.top = y + 'px';
    });

    function soltarPendulo() {
      arrastrando = false;
      img.classList.remove('arrastrando');
    }
    window.addEventListener('pointerup', soltarPendulo);
    window.addEventListener('pointercancel', soltarPendulo);
  </script>
