<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pirámide y Sigilo</title>
<style>
  body { 
    font-family: sans-serif; 
    text-align: center; 
    padding: 15px; 
    background: #000;
    color: #fff;
    margin: 0;
    touch-action: manipulation;
    user-select: none;
  }
  h2 { margin: 20px 0 10px; font-size: 1.4rem; }
  
  .controles {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  input { 
    padding: 12px; 
    font-size: 16px; 
    width: 100%;
    max-width: 300px; 
    border: 2px solid #444; 
    border-radius: 8px; 
    box-sizing: border-box;
    touch-action: manipulation;
    background: #222;
    color: #fff;
  }
  button { 
    padding: 12px 15px; 
    font-size: 16px; 
    cursor: pointer; 
    color: white; 
    border: none; 
    border-radius: 8px; 
    flex-grow: 1;
    max-width: 200px;
    touch-action: manipulation;
  }
  .btn-crear { background: #4CAF50; }
  .btn-crear:active { background: #3d8b40; }
  .btn-limpiar { background: #ff9800; }
  .btn-limpiar:active { background: #e68900; }
  
  #pyramid { margin-top: 20px; overflow-x: auto; padding-bottom: 10px;}
  .row { display: flex; justify-content: center; margin-bottom: 8px; }
  .char {
    width: 40px; height: 40px; line-height: 40px;
    text-align: center; cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 22px; font-weight: bold;
    border-radius: 6px; transition: background 0.2s;
    touch-action: manipulation;
    color: #fff;
  }
  .char:active { background: #333; }

  /* Tachado normal (sin arcoíris) */
  .tached {
    text-decoration: line-through;
    color: #666;
  }

  /* Animación arcoíris tipo neón */
  @keyframes arcoiris {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .arcoiris {
    background: linear-gradient(90deg, #ff0000, #ff9900, #ffff00, #33cc33, #3399ff, #9933ff, #ff0000);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: arcoiris 2s linear infinite;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
    text-decoration: line-through;
  }

  #sigilo { margin-top: 20px; display: flex; flex-direction: column; align-items: center;}
  svg { 
    width: 100%; 
    max-width: 350px; 
    height: auto; 
  }
  .hit-area {
    stroke: transparent; 
    stroke-width: 25; 
    cursor: pointer;
  }
  .sigilo-linea {
    stroke: #fff; 
    stroke-width: 3; 
    pointer-events: none;
    transition: stroke 0.2s;
  }
  .sigilo-linea.activa { stroke: #e53935; stroke-width: 4; }
  .sigilo-punto { fill: #fff; pointer-events: none; }
  .sigilo-numero {
    font-family: sans-serif; font-size: 14px;
    font-weight: bold; fill: #fff;
    pointer-events: none;
  }
</style>
</head>
<body>

  <h2>🔺 Pirámide</h2>
  <div class="controles">
    <input type="text" id="inputText" placeholder="Escribe tus siglas y números...">
    <button class="btn-crear" onclick="generar()">Crear Pirámide</button>
    <button class="btn-limpiar" onclick="limpiarPiramide()">Borrar Tachones</button>
  </div>
  <div id="pyramid"></div>

  <h2> Sigilo</h2>
  <div class="controles">
    <button class="btn-limpiar" onclick="limpiarSigilo()">Borrar Marcas del Sigilo</button>
  </div>
  <div id="sigilo">
    <svg viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="120" fill="none" stroke="#444" stroke-width="1"/>
      
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="150" y1="30"  x2="191" y2="246"/>
        <line class="sigilo-linea" x1="150" y1="30"  x2="191" y2="246"/>
      </g>
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="191" y1="246" x2="268" y2="129"/>
        <line class="sigilo-linea" x1="191" y1="246" x2="268" y2="129"/>
      </g>
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="268" y1="129" x2="46"  y2="204"/>
        <line class="sigilo-linea" x1="268" y1="129" x2="46"  y2="204"/>
      </g>
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="46"  y1="204" x2="254" y2="204"/>
        <line class="sigilo-linea" x1="46"  y1="204" x2="254" y2="204"/>
      </g>
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="254" y1="204" x2="109" y2="246"/>
        <line class="sigilo-linea" x1="254" y1="204" x2="109" y2="246"/>
      </g>
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="109" y1="246" x2="227" y2="58"/>
        <line class="sigilo-linea" x1="109" y1="246" x2="227" y2="58"/>
      </g>
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="227" y1="58"  x2="73"  y2="58"/>
        <line class="sigilo-linea" x1="227" y1="58"  x2="73"  y2="58"/>
      </g>
      <g class="sigilo-conexion" onclick="toggleLinea(this)">
        <line class="hit-area" x1="73"  y1="58"  x2="32"  y2="129"/>
        <line class="sigilo-linea" x1="73"  y1="58"  x2="32"  y2="129"/>
      </g>
      
      <circle class="sigilo-punto" cx="150" cy="30"  r="6"/>
      <circle class="sigilo-punto" cx="227" cy="58"  r="6"/>
      <circle class="sigilo-punto" cx="268" cy="129" r="6"/>
      <circle class="sigilo-punto" cx="254" cy="204" r="6"/>
      <circle class="sigilo-punto" cx="191" cy="246" r="6"/>
      <circle class="sigilo-punto" cx="109" cy="246" r="6"/>
      <circle class="sigilo-punto" cx="46"  cy="204" r="6"/>
      <circle class="sigilo-punto" cx="32"  cy="129" r="6"/>
      <circle class="sigilo-punto" cx="73"  cy="58"  r="6"/>
      
      <text class="sigilo-numero" x="150" y="18"  text-anchor="middle">1</text>
      <text class="sigilo-numero" x="240" y="48"  text-anchor="middle">2</text>
      <text class="sigilo-numero" x="285" y="133" text-anchor="middle">3</text>
      <text class="sigilo-numero" x="270" y="220" text-anchor="middle">4</text>
      <text class="sigilo-numero" x="205" y="265" text-anchor="middle">5</text>
      <text class="sigilo-numero" x="95"  y="265" text-anchor="middle">6</text>
      <text class="sigilo-numero" x="30"  y="220" text-anchor="middle">7</text>
      <text class="sigilo-numero" x="15"  y="133" text-anchor="middle">8</text>
      <text class="sigilo-numero" x="60"  y="48"  text-anchor="middle">9</text>
    </svg>
  </div>

  <script>
    function generar() {
      const texto = document.getElementById('inputText').value.replace(/\s+/g, '');
      const pyramidDiv = document.getElementById('pyramid');
      pyramidDiv.innerHTML = '';
      if (!texto) return;

      let filas = [], i = 1, suma = 0;
      while (suma + i <= texto.length) { filas.push(i); suma += i; i++; }
      if (suma < texto.length) filas[filas.length - 1] += (texto.length - suma);

      let idx = 0;
      filas.forEach(cant => {
        let rowDiv = document.createElement('div');
        rowDiv.className = 'row';
        for (let j = 0; j < cant; j++) {
          let span = document.createElement('span');
          span.className = 'char';
          span.textContent = texto[idx];
          span.onclick = () => {
            span.classList.toggle('arcoiris');
          };
          rowDiv.appendChild(span);
          idx++;
        }
        pyramidDiv.appendChild(rowDiv);
      });
    }

    function limpiarPiramide() {
      document.querySelectorAll('.char').forEach(c => {
        c.classList.remove('arcoiris');
      });
    }

    function toggleLinea(grupo) {
      const lineaVisible = grupo.querySelector('.sigilo-linea');
      lineaVisible.classList.toggle('activa');
    }

    function limpiarSigilo() {
      document.querySelectorAll('.sigilo-linea').forEach(l => l.classList.remove('activa'));
    }
  </script>
</body>
</html>
